[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "db-health-monitor"
version = "0.1.0"
description = "API para monitorear la salud de bases de datos NoSQL"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "cryptography>=43.0,<45.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "PyJWT>=2.9,<3.0",
    "email-validator>=2.2,<3.0",
    "pymongo>=4.10,<5.0",
    "redis>=5.2,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requiere TEST_DATABASE_URL y la base aislada db_health_monitor_test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI declara sus dependencias con Depends(...) en la firma de la ruta.
ignore = ["B008"]
