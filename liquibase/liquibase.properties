# =============================================================================
# LIQUIBASE PROPERTIES — DB HEALTH MONITOR
# Configuración de conexión para PostgreSQL 16
# =============================================================================

# Archivo Changelog Maestro
changeLogFile=changelog/db.changelog-master.xml

# Conexión JDBC a PostgreSQL
url=jdbc:postgresql://localhost:5432/db_health_monitor
username=db_health_app
password=db_health_secret

# Controlador JDBC oficial de PostgreSQL (incluido en contenedor oficial de Liquibase)
driver=org.postgresql.Driver

# Configuración de registro y auditoría
logLevel=info
outputDefaultSchema=false
outputDefaultCatalog=false
